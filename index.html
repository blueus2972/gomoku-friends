<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff6e6"><title>오목 대결! · 다섯 알의 한판</title><link rel="stylesheet" href="style.css"></head><body><div class="decoration" aria-hidden="true">✿<span>✦</span><i>✿</i></div><button id="sound" class="sound" aria-label="효과음 끄기" aria-pressed="true">🔊</button>
<section id="home" class="screen home"><div class="hero"><img src="friends.svg" alt="바둑판을 사이에 두고 웃는 검은 돌과 흰 돌 친구"><span class="eyebrow">작은 돌, 커다란 생각</span><h1>오목 대결<span>!</span></h1><p>돌 <b>5개</b>를 한 줄로 먼저 놓으면 이겨요!</p></div><div class="homebuttons"><button id="ai" class="big blue">🤖 컴퓨터와 대결</button><button id="pvp" class="big pink">👫 짝과 대결</button><button id="rules" class="taupe">📖 규칙 알아보기</button></div><p class="homefoot">서로 한 수씩, 즐겁게 생각해요.</p></section>
<section id="setup" class="screen setup" hidden><button class="back taupe" data-home>← 처음으로</button><div class="setupintro"><span class="eyebrow">나에게 딱 맞는 도전</span><h2>어떤 컴퓨터와<br>겨뤄 볼까요?</h2><p>누가 먼저 둘까요? <b>먼저 두는 사람이 검은 돌</b></p><div class="seg"><button id="humanFirst" class="selected" aria-pressed="true">⚫ 내가 먼저</button><button id="aiFirst" aria-pressed="false">⚪ 컴퓨터 먼저</button></div></div><div class="levels"><button data-level="0"><span>🐣</span><h3>초급</h3><p>처음 해 봐요</p><small>천천히 감을 익혀요</small></button><button data-level="1"><span>🐥</span><h3>중급</h3><p>조금 해 봤어요</p><small>공격도, 수비도 차근차근</small></button><button data-level="2"><span>🦅</span><h3>고급</h3><p>자신 있어요!</p><small>다음 수까지 생각해요</small></button></div></section>
<section id="game" class="screen game" hidden><div class="boardwrap"><div class="boardrim"><div id="board" role="grid" aria-label="15 곱하기 15 오목판"></div></div><p class="boardcaption">가로 · 세로 · 대각선, 다섯 알을 이어 보세요.</p></div><aside><div id="badge" class="badge"></div><div id="turn" class="turn black"><div id="avatar" class="avatar">●</div><div><h2 id="turnTitle">내 차례예요!</h2><p id="turnText">검은 돌을 놓을 곳을 눌러요</p></div></div><p id="message" class="message" role="status" aria-live="polite"></p><div class="actions"><button id="undo" class="blue">↩ 무르기</button><button id="restart" class="orange">↻ 다시 시작</button><button id="change" class="purple">☷ 난이도 바꾸기</button><button class="taupe" data-home>⌂ 처음으로</button></div><div id="score" class="score"></div><div class="gametips"><b>한 수의 힌트</b><p>상대의 돌이 네 개 이어졌나요?<br>먼저 막고, 내 기회를 찾아보세요.</p><label><input id="showForbidden" type="checkbox" checked> 금지 자리를 ×로 표시</label></div></aside></section>
<dialog id="dialog"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div id="dialogActions"></div></dialog><script type="module" src="app.js"></script></body></html>
